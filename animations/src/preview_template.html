<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lottie アニメーション プレビュー</title>
<style>
  :root { --dark: #434343; --green: #338A75; --orange: #E78014; --beige: #D7C1A4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--dark); background: #fff; }
  main { max-width: 1120px; margin: 0 auto; padding: 48px 16px 96px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  .lead { margin: 0 0 24px; line-height: 1.8; font-size: .95rem; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 24px; font-size: .85rem; }
  .controls span { margin-right: 4px; }
  button { font: inherit; font-size: .85rem; padding: 8px 16px; border-radius: 999px; border: 1px solid var(--dark); background: #fff; color: var(--dark); cursor: pointer; }
  button[aria-pressed="true"], button.primary { background: var(--dark); color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; max-width: 420px; margin: 0 auto; } }
  .card { margin: 0; }
  .stage { border: 1px solid #eee; border-radius: 20px; aspect-ratio: 1 / 1; display: flex; align-items: center; justify-content: center; padding: 8%; background: var(--bg); }
  .stage > div { width: 100%; height: 100%; }
  body[data-bg="check"] .stage { background: repeating-conic-gradient(#e6e6e6 0 25%, #fff 0 50%) 0 0 / 20px 20px; }
  body[data-bg="dark"] .stage { background: #222; }
  figcaption { margin-top: 12px; font-size: .9rem; line-height: 1.6; }
  figcaption b { display: block; font-size: 1rem; }
  figcaption small { color: #777; }
</style>
</head>
<body data-bg="card">
<main>
  <h1>Lottie アニメーション プレビュー</h1>
  <p class="lead">
    最初に「登場」を1回だけ再生し、そのあと「ループ」区間を静かに繰り返します。<br />
    背景は透明です。下のボタンで、背景を市松模様にして透明なことを確かめられます。
  </p>

  <div class="controls">
    <button class="primary" id="replay">もう一度再生</button>
    <span style="margin-left:12px">背景：</span>
    <button data-bg="card" aria-pressed="true">カードの色</button>
    <button data-bg="check" aria-pressed="false">透明（市松）</button>
    <button data-bg="dark" aria-pressed="false">暗い背景</button>
  </div>

  <div class="grid">
    <!--CARDS-->
  </div>
</main>

<!--DATA-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie_light.min.js"></script>
<script>
(function () {
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var players = [];

  document.querySelectorAll('[data-lottie]').forEach(function (el) {
    var data = JSON.parse(document.getElementById(el.dataset.lottie).textContent);
    // 区間は JSON の markers に入れてある（intro＝登場、loop＝ループ）
    var intro = data.markers.find(function (m) { return m.cm === 'intro'; });
    var loop = data.markers.find(function (m) { return m.cm === 'loop'; });
    var anim = lottie.loadAnimation({ container: el, renderer: 'svg', loop: false, autoplay: false, animationData: data });
    var p = { anim: anim, visible: false, started: false };

    p.play = function () {
      p.started = true;
      if (reduce) { anim.goToAndStop(loop.tm, true); return; }   // 動きを減らす設定：完成形で止める
      anim.loop = false;
      anim.playSegments([intro.tm, intro.tm + intro.dr], true);
    };
    anim.addEventListener('complete', function () {
      // 登場が終わったら、ループ区間をくり返す
      anim.loop = true;
      anim.playSegments([loop.tm, loop.tm + loop.dr], true);
    });
    players.push(p);

    // 画面に入ったら再生、外に出たら一時停止（負荷を抑える）
    new IntersectionObserver(function (entries) {
      p.visible = entries[0].isIntersecting;
      if (p.visible && !p.started) p.play();
      else if (p.visible && !reduce) anim.play();
      else anim.pause();
    }, { threshold: 0.3 }).observe(el);
  });

  document.getElementById('replay').addEventListener('click', function () {
    players.forEach(function (p) { p.play(); });
  });
  document.querySelectorAll('button[data-bg]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.body.dataset.bg = btn.dataset.bg;
      document.querySelectorAll('button[data-bg]').forEach(function (b) { b.setAttribute('aria-pressed', String(b === btn)); });
    });
  });
})();
</script>
</body>
</html>
