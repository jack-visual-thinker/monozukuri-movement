<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>縦糸と横糸 アニメーション試作</title>
<style>
  :root { --dark: #434343; --green: #338A75; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: "Hiragino Sans", "Noto Sans JP", sans-serif; color: var(--dark); background: #fff; }
  main { max-width: 1040px; margin: 0 auto; padding: 48px 16px 96px; }
  h1 { font-size: 1.4rem; margin: 0 0 8px; }
  p.lead { margin: 0 0 32px; line-height: 1.8; font-size: .95rem; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .compare { grid-template-columns: 1fr; } }
  figure { margin: 0; border: 1px solid #e5e5e5; border-radius: 16px; padding: 16px; }
  figcaption { font-size: .8rem; color: #777; margin-top: 8px; text-align: center; }
  figure img, figure svg { display: block; width: 100%; height: auto; }
  .controls { display: flex; gap: 12px; margin: 24px 0 0; flex-wrap: wrap; }
  button { font: inherit; font-size: .9rem; padding: 10px 18px; border-radius: 999px; border: 1px solid var(--dark); background: #fff; color: var(--dark); cursor: pointer; }
  button.primary { background: var(--dark); color: #fff; }

  /* ── ここからがアニメーション本体（サイトに組み込むときはこのCSSとJSを持っていく） ── */
  /* 線は pathLength="1" にそろえてあるので、dashoffset を 1.1 → 0 にすると「描かれていく」 */
  .weave-anim .warp-reveal,
  .weave-anim .weft { stroke-dasharray: 1 2; stroke-dashoffset: 1.1; }
  .weave-anim.is-drawn .warp-reveal,
  .weave-anim.is-drawn .weft { animation: weave-draw var(--dur) var(--ease) var(--delay) forwards; }
  /* 縦糸：オレンジ→緑→ベージュの順に、上から下へスッと引く */
  .weave-anim .warp-reveal { --dur: .9s; --ease: cubic-bezier(.55, 0, .25, 1); }
  #m-orange .warp-reveal { --delay: 0s; }
  #m-green  .warp-reveal { --delay: .2s; }
  #m-beige  .warp-reveal { --delay: .4s; }
  /* 横糸：右上から入って、縦糸をくぐりながら左下へ抜けていく */
  .weave-anim .weft { --dur: 2.6s; --ease: cubic-bezier(.45, 0, .25, 1); --delay: .95s; }
  @keyframes weave-draw { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .weave-anim .warp-reveal, .weave-anim .weft { stroke-dashoffset: 0 !important; animation: none !important; }
  }
</style>
</head>

  <h1>縦糸と横糸：アニメーション試作</h1>
  <p class="lead">
    元のイラスト（左）を、SVGとCSS/JSだけで動かした版（右）です。Lottieは使っていません。<br />

  </p>

      <figcaption>アニメーション版（SVG）</figcaption>
    </figure>
  </div>

  <div class="controls">
    <button class="primary" id="replay">もう一度再生</button>
    <button id="boil" aria-pressed="true">揺らぎ：ON</button>
  </div>
</main>

<script>
(function () {
  var svg = document.querySelector('.weave-anim');
  var turb = svg.querySelector('feTurbulence');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // 画面に入ったら描き始める
  function play() {
    svg.classList.remove('is-drawn');
    void svg.getBoundingClientRect(); // アニメーションを最初からやり直すため
    svg.classList.add('is-drawn');
  }

  // ボイリング：ノイズの種を約8コマ/秒で切り替え、手描きアニメのように線をぷるぷるさせる
  var boilOn = !reduce, visible = false, seed = 1, timer = null;
  function tick() { seed = seed % 4 + 1; turb.setAttribute('seed', seed); }
  function syncBoil() {
    var run = boilOn && visible;
    if (run && !timer) timer = setInterval(tick, 125);
    if (!run && timer) { clearInterval(timer); timer = null; }
  }

  var played = false;
  new IntersectionObserver(function (entries) {
    visible = entries[0].isIntersecting;
    if (visible && !played) { played = true; play(); }
    syncBoil();
  }, { threshold: 0.35 }).observe(svg);

  document.getElementById('replay').addEventListener('click', play);
  var boilBtn = document.getElementById('boil');
  boilBtn.setAttribute('aria-pressed', String(boilOn));
  boilBtn.textContent = '揺らぎ：' + (boilOn ? 'ON' : 'OFF');
  boilBtn.addEventListener('click', function () {
    boilOn = !boilOn;
    boilBtn.setAttribute('aria-pressed', String(boilOn));
    boilBtn.textContent = '揺らぎ：' + (boilOn ? 'ON' : 'OFF');
    syncBoil();
  });
})();
</script>
